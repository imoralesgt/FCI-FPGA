[project]
name = "fci-fpga-sw"
version = "0.1.0"
description = "Client API and GUI for the FCI-FPGA MicroBlaze CLI (docs/CLI_documentation.md)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyinstaller>=6.21.0",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
    "pyside6>=6.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# fci_api is the only first-party import target; gui/ and examples/ run as scripts, not as an
# installed package, so they are not listed here.
packages = ["fci_api"]
